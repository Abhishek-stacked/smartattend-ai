[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/tmp",XDG_CONFIG_HOME="/tmp/caddy",XDG_DATA_HOME="/tmp/caddy"

[program:api]
command=/bin/sh /app/backend/docker-entrypoint.sh
directory=/app/backend
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/tmp",PORT="8000",FORWARDED_ALLOW_IPS="*",UVICORN_WORKERS="1"
